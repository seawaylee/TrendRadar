app:
  timezone: Asia/Shanghai
  show_version_update: true
  open_browser: false
schedule:
  enabled: true
  preset: finance_digest_card
platforms:
  enabled: true
  sources:
  - id: wallstreetcn-hot
    name: 华尔街见闻
  - id: cls-hot
    name: 财联社热门
  - id: weibo
    name: 微博
  - id: zhihu
    name: 知乎
  - id: thepaper
    name: 澎湃新闻
  - id: ifeng
    name: 凤凰网
  - id: toutiao
    name: 今日头条
  - id: baidu
    name: 百度热搜
  - id: bilibili-hot-search
    name: bilibili 热搜
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 3
  feeds:
  - id: sec-press-releases
    name: SEC 新闻稿
    url: https://www.sec.gov/news/pressreleases.rss
  - id: sec-speeches
    name: SEC 演讲
    url: https://www.sec.gov/news/speeches.rss
  - id: fed-press-all
    name: 美联储全部新闻
    url: https://www.federalreserve.gov/feeds/press_all.xml
  - id: fed-monetary-policy
    name: 美联储货币政策
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
  - id: fed-speeches
    name: 美联储演讲
    url: https://www.federalreserve.gov/feeds/speeches.xml
  - id: bls-latest
    name: 美国劳工统计局最新
    url: https://www.bls.gov/feed/bls_latest.rss
    max_age_days: 2
  - id: bls-cpi
    name: 美国 CPI
    url: https://www.bls.gov/feed/cpi.rss
    max_age_days: 7
  - id: bls-ppi
    name: 美国 PPI
    url: https://www.bls.gov/feed/ppi.rss
    max_age_days: 7
  - id: bea-news
    name: 美国经济分析局
    url: https://apps.bea.gov/rss/rss.xml
    max_age_days: 7
  - id: ecb-press
    name: 欧洲央行新闻稿
    url: https://www.ecb.europa.eu/rss/press.html
  - id: ecb-statpress
    name: 欧洲央行统计新闻
    url: https://www.ecb.europa.eu/rss/statpress.html
    max_age_days: 7
  - id: ecb-fxref-cny
    name: 欧洲央行人民币汇率参考
    url: https://www.ecb.europa.eu/rss/fxref-cny.html
    max_age_days: 2
  - id: boe-news
    name: 英国央行新闻
    url: https://www.bankofengland.co.uk/rss/news
  - id: boe-speeches
    name: 英国央行演讲
    url: https://www.bankofengland.co.uk/rss/speeches
  - id: bis-press
    name: BIS 新闻稿
    url: https://www.bis.org/doclist/all_pressrels.rss
  - id: bis-speeches
    name: BIS 央行演讲
    url: https://www.bis.org/doclist/cbspeeches.rss
  - id: hkex-news-releases
    name: 港交所新闻稿
    url: https://www.hkex.com.hk/Services/RSS-Feeds/News-Releases?sc_lang=en
  - id: hkex-regulatory-announcements
    name: 港交所监管公告
    url: https://www.hkex.com.hk/Services/RSS-Feeds/regulatory-announcements?sc_lang=en
  - id: yahoo-finance
    name: 雅虎财经
    url: https://finance.yahoo.com/news/rssindex
    max_age_days: 2
report:
  mode: current
  display_mode: keyword
  sort_by_position_first: true
  rank_threshold: 8
  max_news_per_keyword: 8
filter:
  method: ai
  priority_sort_enabled: true
ai_filter:
  batch_size: 150
  batch_interval: 2
  min_score: 0.68
  reclassify_threshold: 0.5
  interests_file: finance_deep_dive.txt
  prompt_file: prompt.txt
  extract_prompt_file: extract_prompt.txt
  update_tags_prompt_file: update_tags_prompt.txt
display:
  region_order:
  - new_items
  - hotlist
  - rss
  - standalone
  - ai_analysis
  regions:
    hotlist: true
    new_items: true
    rss: true
    standalone: true
    ai_analysis: true
  standalone:
    platforms:
    - wallstreetcn-hot
    - cls-hot
    rss_feeds:
    - fed-monetary-policy
    - sec-press-releases
    - hkex-regulatory-announcements
    - yahoo-finance
    max_items: 12
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ''
      card_digest:
        enabled: true
        top_k: 10
        history_days: 14
        history_file: output/meta/feishu_digest_history.json
        title: 财经资讯
        scoring_file: config/feishu_digest_scoring.json
        impact_summary:
          enabled: true
          max_items: 8
      openclaw:
        enabled: true
        agent: crawler
        account: crawler
        target: ''
        openclaw_bin: ''
    dingtalk:
      webhook_url: ''
    wework:
      webhook_url: ''
      msg_type: markdown
    telegram:
      bot_token: ''
      chat_id: ''
    email:
      from: ''
      password: ''
      to: ''
      smtp_server: ''
      smtp_port: ''
    ntfy:
      server_url: https://ntfy.sh
      topic: ''
      token: ''
    bark:
      url: ''
    slack:
      webhook_url: ''
    generic_webhook:
      webhook_url: ''
      payload_template: ''
storage:
  backend: auto
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: output
    retention_days: 7
  remote:
    retention_days: 0
    endpoint_url: ''
    bucket_name: ''
    access_key_id: ''
    secret_access_key: ''
    region: ''
  pull:
    enabled: false
    days: 7
ai:
  model: deepseek/deepseek-chat
  api_key: ''
  api_base: ''
  timeout: 120
  temperature: 0.4
  max_tokens: 7000
  num_retries: 2
  fallback_models: []
ai_analysis:
  enabled: true
  language: Chinese
  prompt_file: ai_analysis_prompt.txt
  mode: follow_report
  max_news_for_analysis: 220
  include_rss: true
  include_standalone: true
  include_rank_timeline: true
ai_translation:
  enabled: true
  language: 中文
  prompt_file: ai_translation_prompt.txt
  scope:
    hotlist: false
    rss: true
    standalone: true
advanced:
  debug: false
  version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version
  mcp_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp
  configs_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: http://127.0.0.1:10801
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ''
  weight:
    rank: 0.45
    frequency: 0.4
    hotness: 0.15
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: ━━━━━━━━━━━━━━━━
